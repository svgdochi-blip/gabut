name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      buildVariant:
        description: "Pilih varian APK"
        required: true
        type: choice
        default: NormalDebug
        options:
          - NormalOptimized
          - NormalDebug
          - VROptimized
          - VRDebug
          - LegacyOptimized

jobs:
  build:
    name: Build ${{ inputs.buildVariant }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch upstream tags if needed
        shell: bash
        run: |
          if [ -z "$(git tag -l 'v[0-9]*')" ]; then
            git fetch --no-recurse-submodules --tags --force \
              https://github.com/hrydgard/ppsspp.git || true
          fi

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        env:
          BUILD_VARIANT: ${{ inputs.buildVariant }}
        run: ./gradlew "assemble${BUILD_VARIANT}" --no-daemon --stacktrace

      - name: Collect APK files
        shell: bash
        run: |
          mkdir -p dist
          find android -type f -name "*.apk" -print0 |
            while IFS= read -r -d '' apk; do
              relative_path="${apk#android/}"
              mkdir -p "dist/$(dirname "$relative_path")"
              cp "$apk" "dist/$relative_path"
            done

          if [ -z "$(find dist -type f -name '*.apk' -print -quit)" ]; then
            echo "APK tidak ditemukan setelah build."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.buildVariant }}
          path: dist/
          if-no-files-found: error
